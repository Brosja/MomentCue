name: momentcue
description: A privacy-first, offline-first mobile app for micro-health check-ins.

# Prevent publishing to pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.0.5

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^15.1.1

  # Timezone
  timezone: ^0.9.2
  flutter_native_timezone: ^2.0.0

  # UUID generation
  uuid: ^3.0.7

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # RRULE parsing
  rrule: ^0.2.15

  # Material design icons
  cupertino_icons: ^1.0.2

  # HTTP for backup/restore
  http: ^1.1.0

  # Path provider for file operations
  path_provider: ^2.1.1

  # File picker for backup/restore
  file_picker: ^5.5.0

  # Permission handler
  permission_handler: ^11.0.1

  # Intl for localization
  intl: ^0.18.1

  # Flutter localizations
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^2.0.0

  # Code generation
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  # Add assets folder for app icons and images
  assets:
    - assets/images/
    - assets/icons/

  # Add custom fonts if needed
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf

flutter_intl:
  enabled: true
  class_name: S
  main_locale: en
  arb_dir: lib/l10n
  output_dir: lib/generated
